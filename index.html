<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leadflo — Sales Enablement Workspace</title>
    <meta
      name="description"
      content="Sales-enablement workspace for home-services GTM: live Close CRM pipeline, ICP scoring, and GAP / SPIN / Challenger discovery paths generated per lead."
    />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leadflo — Sales Enablement Workspace" />
    <meta
      property="og:description"
      content="Live Close CRM pipeline, ICP scoring, and methodology-driven discovery (GAP / SPIN / Challenger) for residential HVAC and plumbing GTM. Built by Johnny Scott."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leadflo — Sales Enablement Workspace" />
    <meta name="twitter:description" content="Methodology-driven SDR workspace wired to Close CRM. Built by Johnny Scott." />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #f9f8f6;
        color: #0d0d0d;
        font-family: 'Inter', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
      }
      ::selection {
        background: #ebf212;
        color: #0d0d0d;
      }
      /* Slim scrollbars — this is a dense tool, not a marketing page */
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d2ce;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdb8b3;
      }
      @keyframes lf-fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes lf-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
